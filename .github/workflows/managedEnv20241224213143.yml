on:
  push:
    branches:
    - 2.CambiosWorkAspect
env:
  DOTNET_CORE_VERSION: 7.0.x
  CONTAINER_APP_NAME: blazorappattempt-container-app
  CONTAINER_APP_ENVIRONMENT_NAME: managedEnv20241224213143
  RESOURCE_GROUP: BlazorAppAttemptResourceGroup
  CONTAINER_REGISTRY_NAME: registry20241224213621
  CONTAINER_REGISTRY_LOGIN_SERVER: registry20241224213621.azurecr.io
jobs:
  BuildAndDeployContainerApp:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.managedEnv20241224213143_SPN }}
    - name: Container App deploy
      uses: azure/container-apps-deploy-action@v1
      with:
        appSourcePath: ${{ github.workspace }}
        acrName: ${{ env.CONTAINER_REGISTRY_NAME }}
        acrUsername: ${{ secrets.registry20241224213621_USERNAME_2803 }}
        acrPassword: ${{ secrets.registry20241224213621_PASSWORD_2803 }}
        imageToBuild: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}
        containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT_NAME }}
        resourceGroup: ${{ env.RESOURCE_GROUP }}
